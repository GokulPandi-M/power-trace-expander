roke="rgba(37, 99, 235, 0.40)" stroke-width="40.60720460637978"/></g><g><polyline data-points="9.3525,0.01 9.8525,0.01" data-type="line" data-label="" points="982.8044731373825,221.70959503830719 1023.4116777437623,221.70959503830719" fill="none" stroke="rgba(37, 99, 235, 0.40)" stroke-width="40.60720460637978"/></g><g><rect data-type="rect" data-label="" data-x="1.5" data-y="0" x="142.03230176228922" y="141.3073299176752" width="406.0720460637978" height="162.42881842551915" fill="transparent" stroke="#cbd5e1" stroke-width="0.012313085937499997"/></g><g><rect data-type="rect" data-label="one physical pad" data-x="0" data-y="0" x="198.88238821122096" y="210.33957774852084" width="48.728645527655715" height="24.364322763827886" fill="transparent" stroke="#1d4ed8" stroke-width="0.012313085937499997"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="-0.1" x="198.88238821122096" y="226.58245959107276" width="48.728645527655715" height="8.121440921275962" fill="rgba(59, 130, 246, 0.22)" stroke="rgba(29, 78, 216, 0.45)" stroke-width="0.012313085937499997"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="198.88238821122096" y="218.4610186697968" width="48.728645527655715" height="8.121440921275962" fill="rgba(59, 130, 246, 0.22)" stroke="rgba(29, 78, 216, 0.45)" stroke-width="0.012313085937499997"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0.1" x="198.88238821122096" y="210.33957774852084" width="48.728645527655715" height="8.121440921275962" fill="rgba(59, 130, 246, 0.22)" stroke="rgba(29, 78, 216, 0.45)" stroke-width="0.012313085937499997"/></g><g><rect data-type="rect" data-label="" data-x="3" data-y="0.01" x="442.5256158494997" y="197.34527227447933" width="48.72864552765566" height="48.728645527655715" fill="rgba(100, 116, 139, 0.18)" stroke="rgba(71, 85, 105, 0.45)" stroke-width="0.012313085937499997"/></g><g><rect data-type="rect" data-label="" data-x="8.3525" data-y="0" x="698.5540408927241" y="141.3073299176752" width="406.07204606379787" height="162.42881842551915" fill="transparent" stroke="#cbd5e1" stroke-width="0.012313085937499997"/></g><g><rect data-type="rect" data-label="one physical pad" data-x="6.8525" data-y="0" x="755.4041273416558" y="210.33957774852084" width="48.72864552765566" height="24.364322763827886" fill="transparent" stroke="#1d4ed8" stroke-width="0.012313085937499997"/></g><g><rect data-type="rect" data-label="" data-x="6.8525" data-y="-0.1" x="755.4041273416558" y="226.58245959107276" width="48.72864552765566" height="8.121440921275962" fill="rgba(59, 130, 246, 0.22)" stroke="rgba(29, 78, 216, 0.45)" stroke-width="0.012313085937499997"/></g><g><rect data-type="rect" data-label="" data-x="6.8525" data-y="0" x="755.4041273416558" y="218.4610186697968" width="48.72864552765566" height="8.121440921275962" fill="rgba(59, 130, 246, 0.22)" stroke="rgba(29, 78, 216, 0.45)" stroke-width="0.012313085937499997"/></g><g><rect data-type="rect" data-label="" data-x="6.8525" data-y="0.1" x="755.4041273416558" y="210.33957774852084" width="48.72864552765566" height="8.121440921275962" fill="rgba(59, 130, 246, 0.22)" stroke="rgba(29, 78, 216, 0.45)" stroke-width="0.012313085937499997"/></g><g><rect data-type="rect" data-label="" data-x="9.8525" data-y="0.01" x="999.0473549799344" y="197.34527227447933" width="48.72864552765577" height="48.728645527655715" fill="rgba(100, 116, 139, 0.18)" stroke="rgba(71, 85, 105, 0.45)" stroke-width="0.012313085937499997"/></g><circle data-type="circle" data-label="" data-x="0" data-y="0.01" cx="223.2467109750488" cy="221.70959503830719" r="6.091080690956967" fill="rgba(37, 99, 235, 0.18)" stroke="#1d4ed8" stroke-width="0.012313085937499997"/><circle data-type="circle" data-label="" data-x="6.8525" data-y="0.01" cx="779.7684501054837" cy="221.70959503830719" r="6.091080690956967" fill="rgba(37, 99, 235, 0.18)" stroke="#1d4ed8" stroke-width="0.012313085937499997"/><circle data-type="circle" data-label="" data-x="6.8525" data-y="0.01" cx="779.7684501054837" cy="221.70959503830719" r="3.2485763685103826" fill="rgba(220, 38, 38, 0.55)" stroke="#991b1b" stroke-width="0.012313085937499997"/><text data-type="text" data-label="3 rectangles • one pcb_smtpad identity" data-x="0" data-y="0.45" x="223.2467109750488" y="185.97525498469298" fill="#1e3a8a" font-size="10.557873197658743" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">3 rectangles • one pcb_smtpad identity</text><text data-type="text" data-label="Configured minimum: 0.1500 mm" data-x="1.5" data-y="-0.65" x="345.06832479418813" y="275.3111051187285" fill="#1e3a8a" font-size="14.61859365829672" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Configured minimum: 0.1500 mm</text><text data-type="text" data-label="3 rectangles • one pcb_smtpad identity" data-x="6.8525" data-y="0.45" x="779.7684501054837" y="185.97525498469298" fill="#1e3a8a" font-size="10.557873197658743" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">3 rectangles • one pcb_smtpad identity</text><text data-type="text" data-label="Output minimum: 0.0800 mm" data-x="8.3525" data-y="-0.65" x="901.590063924623" y="275.3111051187285" fill="#991b1b" font-size="14.61859365829672" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Output minimum: 0.0800 mm</text><text data-type="text" data-label="Input: 0.1500 mm fits in the pad union" data-x="1.259" data-y="1.3083624999999999" x="325.4956521739131" y="116.26385165680566" fill="black" font-size="25.04347826086957" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Input: 0.1500 mm fits in the pad union</text><text data-type="text" data-label="Output: terminal reduced to 0.0800 mm" data-x="8.1115" data-y="1.3083624999999999" x="882.0173913043479" y="116.26385165680566" fill="black" font-size="25.04347826086957" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Output: terminal reduced to 0.0800 mm</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="420" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '420');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":81.21440921275956,"c":0,"e":223.2467109750488,"b":0,"d":-81.21440921275956,"f":222.52173913043478};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
