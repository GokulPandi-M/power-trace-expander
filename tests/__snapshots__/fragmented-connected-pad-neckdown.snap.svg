inant-baseline="central">EXPECTED TERMINAL SEGMENT</text><text data-type="text" data-label="ALL 3 ROWS = ONE PHYSICAL PAD" data-x="0" data-y="0.31" x="387.64000000000004" y="112.2" fill="#334155" font-size="19" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">ALL 3 ROWS = ONE PHYSICAL PAD</text><text data-type="text" data-label="TERMINAL" data-x="0" data-y="0.19" x="387.64000000000004" y="157.8" fill="#0f172a" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TERMINAL</text><text data-type="text" data-label="fragment 1" data-x="-0.23" data-y="-0.1" x="300.24" y="268" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 1</text><text data-type="text" data-label="fragment 2" data-x="-0.23" data-y="0" x="300.24" y="230" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 2</text><text data-type="text" data-label="fragment 3" data-x="-0.23" data-y="0.1" x="300.24" y="192" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 3</text><text data-type="text" data-label="BLUE INPUT: 0.1500 mm FITS" data-x="0" data-y="-0.34" x="387.64000000000004" y="359.20000000000005" fill="#1d4ed8" font-size="20.9" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">BLUE INPUT: 0.1500 mm FITS</text><text data-type="text" data-label="CURRENT BUGGY OUTPUT" data-x="1.455" data-y="0.42" x="940.54" y="70.4" fill="#0f172a" font-size="24.7" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">CURRENT BUGGY OUTPUT</text><text data-type="text" data-label="ALL 3 ROWS = ONE PHYSICAL PAD" data-x="1.455" data-y="0.31" x="940.54" y="112.2" fill="#334155" font-size="19" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">ALL 3 ROWS = ONE PHYSICAL PAD</text><text data-type="text" data-label="TERMINAL" data-x="1.455" data-y="0.19" x="940.54" y="157.8" fill="#0f172a" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TERMINAL</text><text data-type="text" data-label="fragment 1" data-x="1.225" data-y="-0.1" x="853.1400000000001" y="268" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 1</text><text data-type="text" data-label="fragment 2" data-x="1.225" data-y="0" x="853.1400000000001" y="230" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 2</text><text data-type="text" data-label="fragment 3" data-x="1.225" data-y="0.1" x="853.1400000000001" y="192" fill="#334155" font-size="13.3" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">fragment 3</text><text data-type="text" data-label="RED OUTPUT: 0.0800 mm &lt; 0.1500 mm MINIMUM" data-x="1.455" data-y="-0.34" x="940.54" y="359.20000000000005" fill="#991b1b" font-size="20.9" font-family="sans-serif" text-anchor="middle" dominant-baseline="central"><![CDATA[RED OUTPUT: 0.0800 mm < 0.1500 mm MINIMUM]]></text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="460" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1400" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1400');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '460');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":380,"c":0,"e":387.64000000000004,"b":0,"d":-380,"f":230};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
