.040564373897723" fill="rgba(59, 130, 246, 0.20)" stroke="#2563eb" stroke-width="0.003221590909090909"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="178.1305114638447" y="230.97971781305114" width="186.24338624338623" height="31.040564373897723" fill="rgba(59, 130, 246, 0.20)" stroke="#2563eb" stroke-width="0.003221590909090909"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0.1" x="178.1305114638447" y="199.93915343915342" width="186.24338624338623" height="31.040564373897695" fill="rgba(59, 130, 246, 0.20)" stroke="#2563eb" stroke-width="0.003221590909090909"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="178.1305114638447" y="199.93915343915342" width="186.24338624338623" height="93.12169312169314" fill="transparent" stroke="#1e3a8a" stroke-width="0.003221590909090909"/></g><g><rect data-type="rect" data-label="" data-x="2.5625" data-y="0" x="849.3827160493825" y="91.2971781305115" width="434.567901234568" height="310.405643738977" fill="transparent" stroke="#cbd5e1" stroke-width="0.003221590909090909"/></g><g><rect data-type="rect" data-label="" data-x="2.3625" data-y="-0.1" x="911.4638447971779" y="262.02028218694886" width="186.24338624338623" height="31.040564373897723" fill="rgba(59, 130, 246, 0.20)" stroke="#2563eb" stroke-width="0.003221590909090909"/></g><g><rect data-type="rect" data-label="" data-x="2.3625" data-y="0" x="911.4638447971779" y="230.97971781305114" width="186.24338624338623" height="31.040564373897723" fill="rgba(59, 130, 246, 0.20)" stroke="#2563eb" stroke-width="0.003221590909090909"/></g><g><rect data-type="rect" data-label="" data-x="2.3625" data-y="0.1" x="911.4638447971779" y="199.93915343915342" width="186.24338624338623" height="31.040564373897695" fill="rgba(59, 130, 246, 0.20)" stroke="#2563eb" stroke-width="0.003221590909090909"/></g><g><rect data-type="rect" data-label="" data-x="2.3625" data-y="0" x="911.4638447971779" y="199.93915343915342" width="186.24338624338623" height="93.12169312169314" fill="transparent" stroke="#1e3a8a" stroke-width="0.003221590909090909"/></g><circle data-type="circle" data-label="" data-x="2.3625" data-y="0.01" cx="1004.5855379188711" cy="243.39594356261023" r="23.28042328042328" fill="transparent" stroke="#1d4ed8" stroke-width="0.003221590909090909"/><circle data-type="circle" data-label="" data-x="2.3625" data-y="0.01" cx="1004.5855379188711" cy="243.39594356261023" r="12.416225749559082" fill="#dc2626" stroke="#991b1b" stroke-width="0.003221590909090909"/><text data-type="text" data-label="SAME PHYSICAL PAD • 3 CONNECTED RECTANGLES" data-x="0.2" data-y="0.4" x="333.33333333333326" y="122.33774250440916" fill="#1e3a8a" font-size="23.28042328042328" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SAME PHYSICAL PAD • 3 CONNECTED RECTANGLES</text><text data-type="text" data-label="1" data-x="-0.24" data-y="-0.1" x="196.75485008818333" y="277.5405643738977" fill="#1e3a8a" font-size="15.520282186948855" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1</text><text data-type="text" data-label="2" data-x="-0.24" data-y="0" x="196.75485008818333" y="246.5" fill="#1e3a8a" font-size="15.520282186948855" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">2</text><text data-type="text" data-label="3" data-x="-0.24" data-y="0.1" x="196.75485008818333" y="215.45943562610228" fill="#1e3a8a" font-size="15.520282186948855" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">3</text><text data-type="text" data-label="INPUT TRACE = 0.1500 mm" data-x="0.2" data-y="-0.34" x="333.33333333333326" y="352.0379188712522" fill="#1d4ed8" font-size="21.728395061728396" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">INPUT TRACE = 0.1500 mm</text><text data-type="text" data-label="SAME PHYSICAL PAD • 3 CONNECTED RECTANGLES" data-x="2.5625" data-y="0.4" x="1066.6666666666665" y="122.33774250440916" fill="#1e3a8a" font-size="23.28042328042328" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">SAME PHYSICAL PAD • 3 CONNECTED RECTANGLES</text><text data-type="text" data-label="1" data-x="2.1224999999999996" data-y="-0.1" x="930.0881834215165" y="277.5405643738977" fill="#1e3a8a" font-size="15.520282186948855" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1</text><text data-type="text" data-label="2" data-x="2.1224999999999996" data-y="0" x="930.0881834215165" y="246.5" fill="#1e3a8a" font-size="15.520282186948855" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">2</text><text data-type="text" data-label="3" data-x="2.1224999999999996" data-y="0.1" x="930.0881834215165" y="215.45943562610228" fill="#1e3a8a" font-size="15.520282186948855" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">3</text><text data-type="text" data-label="BLUE = 0.1500 mm REQUIRED MINIMUM" data-x="2.5625" data-y="-0.34" x="1066.6666666666665" y="352.0379188712522" fill="#1d4ed8" font-size="21.728395061728396" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">BLUE = 0.1500 mm REQUIRED MINIMUM</text><text data-type="text" data-label="RED = 0.0800 mm EMITTED SEGMENT" data-x="2.5625" data-y="-0.43" x="1066.6666666666665" y="379.9744268077601" fill="#991b1b" font-size="21.728395061728396" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">RED = 0.0800 mm EMITTED SEGMENT</text><text data-type="text" data-label="BEFORE — 0.1500 mm INPUT" data-x="0.20000000000000007" data-y="0.6063125" x="333.33333333333326" y="58.29717813051147" fill="black" font-size="33.00000000000001" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">BEFORE — 0.1500 mm INPUT</text><text data-type="text" data-label="AFTER — 0.0800 mm OUTPUT" data-x="2.5625" data-y="0.6063125" x="1066.6666666666665" y="58.29717813051147" fill="black" font-size="33.00000000000001" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">AFTER — 0.0800 mm OUTPUT</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="460" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1400" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1400');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '460');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":310.40564373897706,"c":0,"e":271.2522045855378,"b":0,"d":-310.40564373897706,"f":246.5};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
